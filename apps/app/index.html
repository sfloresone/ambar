<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A moment kept. Still there when you look." />
    <!-- Sign-in links land on /login?verify=<token>; never send the URL on to anyone. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>Ambar</title>
    <script>
      // Apply the saved theme before the first paint. Storage can be unavailable in private contexts.
      try {
        const preference = localStorage.getItem("ambar.theme");
        const dark = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {
        const dark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      }

      // Arriving from the landing's iris (?entry=iris, IRIS_ENTRY in @ambar/ui/components/iris): paint it closed
      // before any JS bundle or CSS loads,
      // so the handoff is ink → ink with the mark, never a white flash. The Iris component opens it.
      if (
        new URLSearchParams(location.search).get("entry") === "iris" &&
        !matchMedia("(prefers-reduced-motion: reduce)").matches
      ) {
        document.documentElement.dataset.entry = "iris";
      }
    </script>
    <style>
      /* Critical, pre-Tailwind: the stylesheet arrives after first paint. Matches Iris's closed frame. */
      #iris-cover { display: none; }
      html[data-entry="iris"], html[data-entry="iris"] body { background: #141414; }
      html[data-entry="iris"] #iris-cover {
        display: grid; place-items: center; position: fixed; inset: 0; z-index: 100; background: #141414;
      }
      #iris-cover svg { width: 6rem; height: 6rem; }
    </style>
  </head>
  <body>
    <!-- The mark is inlined as <svg> at build/dev time from @ambar/ui/lib/mark-paths (see vite.config.ts). -->
    <div id="iris-cover" aria-hidden="true"><!-- iris-mark --></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
